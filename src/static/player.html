<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudPlay Video Player</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="stylesheet" href="player.css">
</head>
<body class="theme-dark">
  <div id="player-container" class="player-container">
    <!-- Main Video Surface -->
    <div class="video-wrapper">
      <video id="video-element" playsinline preload="auto"></video>
      <div id="video-backdrop" class="video-backdrop"></div>
      
      <!-- Top Overlay Bar (Title + Status + Close) -->
      <header class="top-bar">
        <div class="brand">
          <span class="brand-badge">CloudPlay</span>
          <span id="current-title" class="media-title" title="No media loaded">No media loaded</span>
        </div>
        <div class="top-actions">
          <span id="codec-pill" class="pill pill-codec" hidden>TS</span>
          <span id="speed-pill" class="pill pill-subtle">1.0x</span>
          <button id="btn-toggle-playlist" class="btn-icon" title="Toggle Playlist (L)" aria-label="Toggle Playlist">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            <span id="playlist-badge" class="badge">0</span>
          </button>
        </div>
      </header>

      <!-- Center Big Play/Pause/Buffering Indicator -->
      <div id="center-indicator" class="center-indicator" hidden>
        <div class="spinner"></div>
      </div>

      <!-- Warning / Notification Toast -->
      <div id="alert-toast" class="alert-toast" hidden>
        <span id="alert-text"></span>
        <button id="alert-dismiss" class="btn-icon-xs">&times;</button>
      </div>

      <!-- Bottom Controls Bar -->
      <div id="controls-bar" class="controls-bar">
        <!-- Progress / Timeline Slider -->
        <div class="timeline-container">
          <div id="timeline-progress" class="timeline-bar">
            <div id="buffered-bar" class="buffered-range"></div>
            <div id="played-bar" class="played-range"></div>
            <div id="seek-thumb" class="seek-thumb"></div>
          </div>
          <div id="timeline-tooltip" class="timeline-tooltip">00:00</div>
        </div>

        <!-- Buttons Row -->
        <div class="controls-row">
          <div class="controls-left">
            <button id="btn-prev" class="btn-ctrl" title="Previous Video (Shift+P)" aria-label="Previous">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button id="btn-play-pause" class="btn-ctrl btn-primary" title="Play/Pause (Space)" aria-label="Play/Pause">
              <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button id="btn-next" class="btn-ctrl" title="Next Video (Shift+N)" aria-label="Next">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>

            <!-- Volume Control -->
            <div class="volume-container">
              <button id="btn-mute" class="btn-ctrl" title="Mute (M)" aria-label="Mute">
                <svg id="icon-vol-high" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg id="icon-vol-mute" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" class="slider volume-slider" aria-label="Volume">
            </div>

            <!-- Time Display -->
            <div class="time-display">
              <span id="time-current">0:00</span>
              <span class="time-sep">/</span>
              <span id="time-duration">0:00</span>
            </div>
          </div>

          <div class="controls-right">
            <!-- Playback Speed Menu -->
            <div class="dropdown-container">
              <button id="btn-speed" class="btn-ctrl-text" title="Playback Speed">1x</button>
              <div id="speed-menu" class="dropdown-menu" hidden>
                <button data-speed="0.5">0.5x</button>
                <button data-speed="0.75">0.75x</button>
                <button data-speed="1.0" class="active">1.0x</button>
                <button data-speed="1.25">1.25x</button>
                <button data-speed="1.5">1.5x</button>
                <button data-speed="2.0">2.0x</button>
              </div>
            </div>

            <!-- Subtitles (CC) Button -->
            <button id="btn-cc" class="btn-ctrl" title="Subtitles / Captions (C)" aria-label="Subtitles">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1z"/></svg>
            </button>

            <!-- Picture in Picture -->
            <button id="btn-pip" class="btn-ctrl" title="Picture-in-Picture (P)" aria-label="Picture in Picture">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 0H3V5h18v14z"/></svg>
            </button>

            <!-- Fullscreen -->
            <button id="btn-fullscreen" class="btn-ctrl" title="Fullscreen (F)" aria-label="Fullscreen">
              <svg id="icon-fs-enter" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              <svg id="icon-fs-exit" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" hidden><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Drag & Drop Overlay -->
      <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-box">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#6366f1" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <h3>Drop video or subtitle files here</h3>
          <p>MPEG-TS (.ts), MP4, MKV, WebM, SRT, VTT</p>
        </div>
      </div>
    </div>

    <!-- Collapsible Playlist Sidebar -->
    <aside id="playlist-sidebar" class="playlist-sidebar">
      <div class="sidebar-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <h3>Playlist</h3>
          <span id="playlist-count" class="count-badge">0 items</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button id="btn-open-file" class="btn-icon" title="Open Local Files" aria-label="Open Files">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <input id="file-picker-input" type="file" multiple accept="video/*,.ts,.m2ts,.mts,.mkv,.srt,.vtt" style="display:none">
          <button id="btn-close-playlist" class="btn-icon" aria-label="Close sidebar">&times;</button>
        </div>
      </div>
      <div id="playlist-items" class="playlist-items">
        <!-- Rendered items -->
      </div>
      <div class="sidebar-footer">
        <label class="toggle-control">
          <input id="chk-auto-next" type="checkbox" checked>
          <span>Auto-play next</span>
        </label>
      </div>
    </aside>
  </div>

  <script type="module" src="player.js"></script>
</body>
</html>
