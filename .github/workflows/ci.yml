name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification & build
        run: npm run check

      - name: Upload Chrome Extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudplay-chrome
          path: dist/cloudplay-chrome.zip

      - name: Upload Firefox Extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudplay-firefox
          path: dist/cloudplay-firefox.zip
